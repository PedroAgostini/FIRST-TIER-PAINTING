  <style>
    :root { --ink: #121E30; --tier: #3363AC; --shore: #8FAAD6; --mist: #C9D7EC; --frost: #EAF0F8; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      font-family: "Lexend", ui-sans-serif, system-ui, sans-serif;
      color: #fff;
      background: var(--ink);
      -webkit-font-smoothing: antialiased;

    ::selection { background: var(--tier); color: #fff; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--shore); outline-offset: 3px; }
    header { padding: 20px clamp(16px, 4vw, 40px); }
    header img { height: 48px; width: auto; display: block; }
    main {
      position: relative;
      display: grid;
      place-items: center;
      padding: 24px clamp(16px, 4vw, 40px) 48px;
      overflow: clip;
      isolation: isolate;
    }
    /* Brand watermark */
    main::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -6%;
      bottom: -14%;
      width: clamp(300px, 46vw, 640px);
      aspect-ratio: 1385 / 1377;
      background: url("/assets/logo/icon-white.webp") center / contain no-repeat;
      opacity: .05;
      rotate: -10deg;
    }
    .card { max-width: 820px; text-align: center; display: grid; justify-items: center; gap: 18px; }
    .code {
      font-size: clamp(5.5rem, 3rem + 10vw, 10rem);
      font-weight: 800;
      line-height: .85;
      letter-spacing: -.06em;
      color: var(--frost);
    }
    .code span { color: var(--shore); }
    .label {
      font-family: "Lexend Zetta", "Lexend", sans-serif;
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--shore);
    }
    h1 { margin: 0; font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.75rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.08; text-wrap: balance; }
    p { margin: 0; color: var(--mist); font-size: 1.0625rem; line-height: 1.6; max-width: 46ch; text-wrap: pretty; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 14px 24px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 2px;
      transition: background-color .25s, box-shadow .25s, transform .3s;
    }
    .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .btn-tier { background: var(--tier); color: #fff; }
    .btn-tier:hover { background: #2A5698; transform: translateY(-2px); }
    .btn-outline { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .5); }
    .btn-outline:hover { box-shadow: inset 0 0 0 1.5px #fff; transform: translateY(-2px); }
    footer { padding: 18px; text-align: center; font-size: .8125rem; color: var(--shore); border-top: 1px solid rgba(201, 215, 236, .14); }
    @media (max-width: 480px) { .actions .btn { width: 100%; justify-content: center; } }
